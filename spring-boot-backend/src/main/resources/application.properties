# Application Details
spring.application.name=blood-donation-backend
server.port=8080
server.error.include-message=always

# Database Configuration (Default PostgreSQL, fallback H2 for quick local testing if DB not present)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blood_donation_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Centralized JWT Configuration (Supports JWT_SECRET_KEY, JWT_SECRET, and JWT_ALGORITHM)
app.jwt.secret=${JWT_SECRET_KEY:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.algorithm=${JWT_ALGORITHM:HS256}

# Rate Limiting Configuration
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=15

# OpenAPI / Swagger Properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
